events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/nginx/access.log json;
    error_log /var/log/nginx/error.log warn;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream backend { server backend:8000; keepalive 16; }
    upstream frontend { server frontend:8080; keepalive 8; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 2m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # Enable only on the TLS virtual host after certificates are configured:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location ~ ^/health(?:/|$) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }
        location / { proxy_pass http://frontend; proxy_set_header Host $host; }
    }
}
